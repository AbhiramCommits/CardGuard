services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cardguard
      POSTGRES_PASSWORD: cardguard
      POSTGRES_DB: cardguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardguard -d cardguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.27.0
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: cardguard
      POSTGRES_PWD: cardguard
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "tctl --address 127.0.0.1:7233 namespace list > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  temporal-ui:
    image: temporalio/ui:2.34.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      - temporal

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://cardguard:cardguard@postgres:5432/cardguard
      TEMPORAL_HOST: temporal:7233
      CARDGUARD_MODEL_PATH: ${CARDGUARD_MODEL_PATH:-ml/artifacts/model_v1.joblib}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python workflows/worker.py
    environment:
      DATABASE_URL: postgresql+psycopg://cardguard:cardguard@postgres:5432/cardguard
      TEMPORAL_HOST: temporal:7233
      CARDGUARD_TASK_QUEUE: cardguard-risk
      CARDGUARD_MODEL_PATH: ${CARDGUARD_MODEL_PATH:-ml/artifacts/model_v1.joblib}
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy

volumes:
  pgdata:
