[project]
name = "cardguard"
version = "0.1.0"
description = "Real-time card authorization risk engine"
requires-python = ">=3.12"

dependencies = [
    "flask>=3.0,<4",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "gunicorn>=22,<24",
]

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "joblib>=1.3,<2",
    "lightgbm>=4.5,<5",
    "mypy>=1.13,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<6",
    "ruff>=0.8,<1",
    "scikit-learn>=1.5,<2",
    "temporalio>=1.9,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "module"
